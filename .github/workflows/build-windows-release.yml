name: Build Windows Pre-release

"on":
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Copy ffmpeg binaries into assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets\ffmpeg-bin\windows | Out-Null
          $ffmpeg = (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue).Source
          if (-not $ffmpeg) { $ffmpeg = "C:\ProgramData\chocolatey\bin\ffmpeg.exe" }
          $ffprobe = (Get-Command ffprobe.exe -ErrorAction SilentlyContinue).Source
          if (-not $ffprobe) { $ffprobe = "C:\ProgramData\chocolatey\bin\ffprobe.exe" }
          Write-Host "ffmpeg: $ffmpeg"
          Write-Host "ffprobe: $ffprobe"
          Copy-Item $ffmpeg -Destination assets\ffmpeg-bin\windows\ffmpeg.exe
          Copy-Item $ffprobe -Destination assets\ffmpeg-bin\windows\ffprobe.exe

      - name: Generate icon assets
        run: python scripts/generate_icon.py

      - name: Build onefile executable (single portable .exe)
        run: python -m PyInstaller --clean --distpath dist_onefile pyinstaller.spec

      - name: Build onedir bundle (portable folder)
        run: python -m PyInstaller --distpath dist_onedir pyinstaller-onedir.spec

      - name: Smoke-test both builds (start offscreen, must stay alive)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          function Test-Build($path, $label) {
            Write-Host "Smoke-testing $label : $path"
            if (-not (Test-Path $path)) { Write-Error "$label missing at $path"; return $false }
            $p = Start-Process -FilePath $path -PassThru
            Start-Sleep -Seconds 40
            if ($p.HasExited) {
              Write-Error "$label exited early with code $($p.ExitCode)"
              return $false
            }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "$label started OK"
            return $true
          }
          $version = (Get-Content VERSION).Trim()
          $a = Test-Build "dist_onefile\Visual-Stimulus-Kit-Tool-$version-portable.exe" "onefile"
          $b = Test-Build "dist_onedir\Visual Stimulus Kit Tool\Visual Stimulus Kit Tool.exe" "onedir"
          if (-not ($a -and $b)) { exit 1 }

      - name: Package onedir bundle as ZIP
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $zip = "Visual-Stimulus-Kit-Tool-$version-portable-folder.zip"
          Compress-Archive -Path "dist_onedir\Visual Stimulus Kit Tool" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"

      - name: Report artifact sizes
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          Get-ChildItem "dist_onefile\Visual-Stimulus-Kit-Tool-$version-portable.exe", "Visual-Stimulus-Kit-Tool-$version-portable-folder.zip" |
            ForEach-Object { "{0,-60} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $dir = Get-ChildItem "dist_onedir\Visual Stimulus Kit Tool" -Recurse | Measure-Object -Property Length -Sum
          "{0,-60} {1,8:N1} MB" -f "onedir folder (extracted)", ($dir.Sum / 1MB)

      # NSIS installer temporarily disabled until the uninstaller/registry issue
      # is fixed (planned for after the refactor/modularize + PWA work). The
      # installer script (installer/videoannotation_installer.nsi) is retained.
      # Portable exe only for now.
      - name: Upload pre-release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ## Downloads — which one should I get?

            **`Visual-Stimulus-Kit-Tool-<version>-portable.exe`** — single portable file.
            Just download and run; nothing to extract or install. Best when you
            want the simplest possible download, or you're running it once off a
            thumb drive. Trade-off: **it starts slowly**, because Windows has to
            unpack the whole program into a temporary folder on *every* launch
            (noticeably slow on older laptops, virtual machines, or with strict
            antivirus).

            **`Visual-Stimulus-Kit-Tool-<version>-portable-folder.zip`** — portable folder.
            Extract the ZIP once, then run `Visual Stimulus Kit Tool.exe` inside
            the extracted folder. **Starts much faster** (nothing is unpacked at
            launch) and still fully portable — the folder can live on a thumb
            drive. Trade-off: you must extract it first, and you need to keep the
            folder together (the `_internal` folder next to the .exe is required).

            Both are the same application. If you use the app regularly, prefer
            the **portable folder**; if you just want a quick one-off run, take
            the **single .exe**.

            > ⚠️ **Unverified pre-release.** Not yet verified as stable — please
            > test with non-critical copies of your data.
          files: |
            dist_onefile/Visual-Stimulus-Kit-Tool-${{ steps.version.outputs.version }}-portable.exe
            Visual-Stimulus-Kit-Tool-${{ steps.version.outputs.version }}-portable-folder.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
